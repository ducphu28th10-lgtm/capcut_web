<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tải Video</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #0d1117; color: #e6edf3; padding: 30px; }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { color: #f0883e; margin-bottom: 30px; text-align: center; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 25px; }
        a.back { display: inline-block; margin-bottom: 20px; color: #58a6ff; text-decoration: none; }
        a.back:hover { text-decoration: underline; }
        label { display: block; margin: 10px 0 5px; font-weight: 600; color: #8b949e; }
        input[type="text"] { 
            width: 100%; padding: 12px; background: #0d1117; color: #e6edf3; 
            border: 1px solid #30363d; border-radius: 6px; font-size: 14px;
        }
        select { 
            width: 100%; padding: 12px; background: #0d1117; color: #e6edf3; 
            border: 1px solid #30363d; border-radius: 6px; font-size: 14px;
        }
        button { 
            width: 100%; padding: 15px; background: #f0883e; color: #fff; border: none; 
            border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer;
            margin-top: 20px; transition: 0.2s;
        }
        button:hover { background: #e07b30; }
        .error { color: #f85149; margin-top: 15px; padding: 10px; background: #2d1b1b; border-radius: 6px; }
        .loading { display: none; color: #ffff00; margin-top: 15px; text-align: center; }
    </style>
</head>
<body>
<div class="container">
    <a href="/" class="back">← Quay lại</a>
    <div class="card">
        <h1>🎬 TẢI VIDEO</h1>
        
        {% if error %}
        <div class="error">❌ {{ error }}</div>
        {% endif %}
        
        <form method="POST" action="/download-video" onsubmit="showLoading()">
            <label>Nhập link video:</label>
            <input type="text" name="video_url" placeholder="https://..." required>
            
            <label>Chất lượng:</label>
            <select name="quality">
                <option value="best">Chất lượng tốt nhất</option>
                <option value="720">720p</option>
                <option value="1080">1080p</option>
                <option value="audio">Chỉ âm thanh (MP3)</option>
            </select>
            
            <button type="submit">⬇️ TẢI VIDEO</button>
        </form>
        
        <div class="loading" id="loading">
            🔄 Đang xử lý... Vui lòng đợi...
        </div>
    </div>
</div>

<script>
    function showLoading() {
        document.getElementById('loading').style.display = 'block';
    }
</script>
</body>
</html>
